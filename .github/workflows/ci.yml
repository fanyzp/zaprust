name: CI

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Pull requests: every commit subject must be Conventional Commits.
  commit-messages:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check commit subjects
        run: scripts/check-commits.sh "origin/${{ github.base_ref }}..HEAD"

  # Linux is the strict gate: fmt + clippy -D warnings + tests
  # + release build.
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: System dependencies (egui / winit / whatsapp-rust on Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake perl clang \
            libclang-dev libasound2-dev libpipewire-0.3-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libgl1-mesa-dev libgtk-3-dev libopus-dev

      - name: Rust toolchain (stable + rustfmt + clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy (warnings denied)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

      - name: Release build
        run: cargo build --release -p app

  # Windows and macOS: build + test (warnings not denied here;
  # Linux above is the strict gate).
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Tests
        run: cargo test --workspace

      - name: Release build
        run: cargo build --release -p app

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: System dependencies
        run: brew install cmake perl

      - name: Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Tests
        run: cargo test --workspace

      - name: Release build
        run: cargo build --release -p app

  # ARM64 targets: build + test on GitHub ARM runners, so every
  # change is exercised on the architectures the releases ship.
  linux-arm:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: System dependencies (egui / winit / whatsapp-rust on Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake perl clang \
            libclang-dev libasound2-dev libpipewire-0.3-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libgl1-mesa-dev libgtk-3-dev libopus-dev

      - name: Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Tests
        run: cargo test --workspace

      - name: Release build
        run: cargo build --release -p app

  windows-arm:
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Tests
        run: cargo test --workspace

      - name: Release build
        run: cargo build --release -p app
