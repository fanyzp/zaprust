[package]
name = "camera"
version.workspace = true
publish = false
description = "Camera capture for Zaprust: a small safe API over Video4Linux2. This crate is the one place raw device ioctls live; the rest of the workspace forbids unsafe code."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

# Deliberately NOT the workspace lints: the workspace forbids
# unsafe code, and this crate exists precisely to hold the one
# unsafe surface (V4L2 ioctls and mmap) behind a safe API.
# Every unsafe block inside carries its own safety note.

[dependencies]
libc = "0.2"
