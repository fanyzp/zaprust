[package]
name = "core"
version.workspace = true
publish = false
description = "Zaprust core: data models, theme tokens, credentials, update checks, demo data. Pure logic, no window, fully tested."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[lints]
workspace = true

[features]
default = []
# OS keyring credential backend (Secret Service / Credential
# Manager / Keychain). Off by default so core stays dependency-light
# and testable anywhere; the app enables it.
keyring-store = ["dep:keyring"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10"
getrandom = "0.3"
idna = "1"
ring = "0.17"
base64 = "0.22"
zip = { version = "2", default-features = false, features = ["deflate"] }

# The keyring backend must be a real persistent platform store,
# selected explicitly per target (see the store crate's manifest
# for the full story): with no platform feature the keyring crate
# silently substitutes an in-memory mock that persists nothing.
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", optional = true, features = ["linux-native-sync-persistent", "crypto-rust", "vendored"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", optional = true, features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", optional = true, features = ["windows-native"] }

[target.'cfg(not(any(target_os = "linux", target_os = "macos", target_os = "windows")))'.dependencies]
keyring = { version = "3", optional = true }

[dev-dependencies]
proptest = "1"

