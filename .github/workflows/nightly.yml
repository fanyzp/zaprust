name: Nightly

# Rolling nightly prerelease from the nightly branch (beta):
# built on demand only (manual workflow_dispatch, no schedule),
# published to the fixed "nightly" release whose assets are
# replaced each run.
# Version strings look like
# 0.20.0-nightly.20261114+abc1234 (in the release title/body,
# the workspace version itself is not rewritten).
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: zaprust-linux-x86_64
            binary: target/release/zaprust
          - os: ubuntu-24.04-arm
            artifact: zaprust-linux-arm64
            binary: target/release/zaprust
          - os: windows-latest
            artifact: zaprust-windows-x86_64.exe
            binary: target/release/zaprust.exe
          - os: windows-11-arm
            artifact: zaprust-windows-arm64.exe
            binary: target/release/zaprust.exe
          - os: macos-latest
            artifact: zaprust-macos-arm64
            binary: target/release/zaprust
    steps:
      - uses: actions/checkout@v4
        with:
          ref: nightly

      - name: System dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake perl clang \
            libclang-dev libasound2-dev libpipewire-0.3-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libgl1-mesa-dev libgtk-3-dev libopus-dev

      - name: System dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake perl

      - name: Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release -p app

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          cp "${{ matrix.binary }}" "dist/${{ matrix.artifact }}"
          cd dist && sha256sum "${{ matrix.artifact }}" > "${{ matrix.artifact }}.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: nightly

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Version + checksums
        id: ver
        run: |
          base=$(grep -m1 '^version = ' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          nightly="${base}-nightly.$(date -u +%Y%m%d)+$(git rev-parse --short HEAD)"
          echo "version=$nightly" >> "$GITHUB_OUTPUT"
          cd dist
          cat -- *.sha256 > SHA256SUMS
          rm -- *.sha256
          ls -la

      - name: Refresh the rolling nightly release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: "Nightly, ${{ steps.ver.outputs.version }}"
          body: |
            Rolling nightly build of Zaprust from `nightly` (beta).
            Version: ${{ steps.ver.outputs.version }}
            Unstable by definition; for the current stable build see the versioned releases.
          prerelease: true
          files: dist/*
